<svg width="240" height="200" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGradPeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screenGradPeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="eyeGlowPeep" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- WINDOW / SCREEN EDGE LINE -->
  <line x1="10" y1="150" x2="230" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- ANTENNA & MINECRAFT COBBLESTONE CUBE -->
  <path d="M135 60 C 145 46, 150 35, 154 22" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(146, 8)">
    <polygon points="10,0 20,5 10,10 0,5" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
    <polygon points="0,5 10,10 10,21 0,16" fill="#475569" stroke="#334155" stroke-width="1"/>
    <polygon points="10,10 20,5 20,16 10,21" fill="#334155" stroke="#1e293b" stroke-width="1"/>
    <rect x="3" y="8" width="2" height="2" fill="#64748b"/>
    <rect x="12" y="12" width="2" height="2" fill="#1e293b"/>
  </g>

  <!-- TILTED PEEKING HEAD -->
  <g transform="rotate(7 120 105)">
    <rect x="68" y="55" width="104" height="84" rx="42" fill="url(#bodyGradPeep)" stroke="#94a3b8" stroke-width="2.5"/>
    <ellipse cx="66" cy="97" rx="5" ry="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <ellipse cx="174" cy="97" rx="5" ry="14" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="76" y="65" width="86" height="64" rx="28" fill="url(#screenGradPeep)" stroke="#1e293b" stroke-width="2"/>
    <g filter="url(#eyeGlowPeep)">
      <path d="M 94 98 C 98 90, 106 90, 110 98" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 126 98 C 130 90, 138 90, 142 98" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- LEFT ARM GRIPPING SCREEN EDGE -->
  <path d="M82 135 C 76 138, 64 144, 60 148" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="60" cy="148" rx="8" ry="5" fill="#475569"/>

  <!-- RIGHT ARM DANGLING DOWN PAST EDGE -->
  <path d="M168 128 C 176 138, 186 156, 190 172" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  <circle cx="191" cy="176" r="4" fill="#475569"/>
</svg>
