<svg width="220" height="260" viewBox="0 0 220 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGradPeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screenGradPeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="eyeGlowPeep" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ANTENNA STEM & MINECRAFT COBBLESTONE CUBE -->
  <path d="M125 50 C 135 38, 142 26, 145 16" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(138, 4)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
    <polygon points="0,6 12,12 12,25 0,19" fill="#475569" stroke="#334155" stroke-width="1"/>
    <polygon points="12,12 24,6 24,19 12,25" fill="#334155" stroke="#1e293b" stroke-width="1"/>
    <rect x="3" y="9" width="3" height="3" fill="#64748b"/>
    <rect x="15" y="14" width="3" height="3" fill="#1e293b"/>
    <rect x="18" y="9" width="2" height="2" fill="#64748b"/>
  </g>

  <!-- HEAD (Gently tilted in contented rest) -->
  <g transform="rotate(3 106 88)">
    <rect x="52" y="44" width="108" height="88" rx="44" fill="url(#bodyGradPeep)" stroke="#94a3b8" stroke-width="2.5"/>
    <ellipse cx="50" cy="88" rx="6" ry="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="49" cy="88" rx="2" ry="8" fill="#38bdf8"/>
    <ellipse cx="162" cy="88" rx="6" ry="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="163" cy="88" rx="2" ry="8" fill="#38bdf8"/>
    <rect x="62" y="54" width="88" height="68" rx="30" fill="url(#screenGradPeep)" stroke="#1e293b" stroke-width="2"/>
    
    <!-- HAPPY SLEEPING / RESTING EYES (Upward crescent curves) -->
    <g filter="url(#eyeGlowPeep)">
      <path d="M 80 88 C 84 80, 94 80, 98 88" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M 114 88 C 118 80, 128 80, 132 88" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <!-- Content smile -->
      <path d="M 100 102 C 103 105, 109 105, 112 102" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- TORSO -->
  <g transform="translate(0, 10)">
    <rect x="98" y="122" width="16" height="8" rx="3" fill="#64748b"/>
    <path d="M76 130 C 76 130, 80 178, 86 186 C 92 192, 120 192, 126 186 C 132 178, 136 130, 136 130 Z" fill="url(#bodyGradPeep)" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="106" cy="154" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#eyeGlowPeep)"/>
  </g>

  <!-- ARMS RESTING IN LAP -->
  <g transform="translate(0, 10)">
    <circle cx="68" cy="140" r="5" fill="#64748b"/>
    <rect x="52" y="142" width="26" height="12" rx="6" transform="rotate(50 52 142)" fill="url(#bodyGradPeep)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="70" cy="168" r="4.5" fill="#475569"/>

    <circle cx="144" cy="140" r="5" fill="#64748b"/>
    <rect x="134" y="142" width="26" height="12" rx="6" transform="rotate(-50 134 142)" fill="url(#bodyGradPeep)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="142" cy="168" r="4.5" fill="#475569"/>
  </g>

  <!-- SITTING / RESTING LEGS (Folded neatly forward) -->
  <g transform="translate(0, 10)">
    <circle cx="86" cy="186" r="5" fill="#64748b"/>
    <rect x="74" y="186" width="22" height="13" rx="6" fill="url(#bodyGradPeep)" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="70" cy="198" rx="10" ry="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

    <circle cx="126" cy="186" r="5" fill="#64748b"/>
    <rect x="116" y="186" width="22" height="13" rx="6" fill="url(#bodyGradPeep)" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="142" cy="198" rx="10" ry="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  </g>
</svg>
