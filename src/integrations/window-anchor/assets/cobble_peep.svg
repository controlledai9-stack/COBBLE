<svg width="200" height="230" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pebCeramic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#F1F5F9"/>
      <stop offset="78%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pebOled" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="pebHand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="pebNeon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1.5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="pebAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="60%" stop-color="rgba(56, 189, 248, 0.1)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </radialGradient>
  </defs>

  <!-- SOFT RESTING HOVER AURA -->
  <ellipse cx="100" cy="204" rx="36" ry="10" fill="url(#pebAura)"/>

  <!-- HANDS TUCKED IN PEACEFULLY -->
  <g transform="translate(6, 4) rotate(4 34 120)">
    <ellipse cx="34" cy="120" rx="10" ry="16" fill="url(#pebHand)" stroke="#94A3B8" stroke-width="1.8"/>
    <circle cx="34" cy="116" r="2.2" fill="#38BDF8" opacity="0.6"/>
  </g>
  <g transform="translate(-6, 4) rotate(-4 166 120)">
    <ellipse cx="166" cy="120" rx="10" ry="16" fill="url(#pebHand)" stroke="#94A3B8" stroke-width="1.8"/>
    <circle cx="166" cy="116" r="2.2" fill="#38BDF8" opacity="0.6"/>
  </g>

  <!-- ANTENNA & 3D COBBLESTONE BLOCK -->
  <path d="M 100 48 C 100 32, 106 24, 110 16" stroke="#94A3B8" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="110" cy="16" r="4.5" fill="#38BDF8" opacity="0.8" filter="url(#pebNeon)"/>
  <g transform="translate(104, -4) scale(0.85)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#94A3B8" stroke="#334155" stroke-width="0.8"/>
    <polygon points="0,6 12,12 12,24 0,18" fill="#475569" stroke="#334155" stroke-width="0.8"/>
    <polygon points="12,12 24,6 24,18 12,24" fill="#334155" stroke="#1E293B" stroke-width="0.8"/>
    <rect x="3" y="9" width="3" height="3" fill="#64748B"/>
    <rect x="15" y="14" width="3" height="3" fill="#1E293B"/>
  </g>

  <!-- SMOOTH PEBBLE CHASSIS -->
  <path d="M 100 45 C 142 45, 160 70, 160 114 C 160 156, 138 188, 100 188 C 62 188, 40 156, 40 114 C 40 70, 58 45, 100 45 Z" fill="url(#pebCeramic)" stroke="#94A3B8" stroke-width="2.4"/>
  <path d="M 64 165 C 78 180, 122 180, 136 165 C 128 178, 72 178, 64 165 Z" fill="#94A3B8" opacity="0.35"/>

  <!-- EMBEDDED OLED VISOR -->
  <path d="M 100 64 C 130 64, 144 76, 144 104 C 144 128, 130 142, 100 142 C 70 142, 56 128, 56 104 C 56 76, 70 64, 100 64 Z" fill="url(#pebOled)" stroke="#1E293B" stroke-width="2"/>
  <circle cx="100" cy="166" r="4" fill="#0284C7" stroke="#38BDF8" stroke-width="1.4" opacity="0.6" filter="url(#pebNeon)"/>

  <!-- SLEEPY HAPPY EYES & CONTENT SMILE -->
  <g filter="url(#pebNeon)">
    <path d="M 73 98 C 77 88, 89 88, 93 98" stroke="#38BDF8" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M 107 98 C 111 88, 123 88, 127 98" stroke="#38BDF8" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <path d="M 96 118 C 98 121, 102 121, 104 118" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
