<svg width="220" height="260" viewBox="0 0 220 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pebBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pebScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="pebGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ANTENNA & MINECRAFT COBBLESTONE CUBE -->
  <path d="M125 46 C 135 34, 142 22, 145 12" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(138, 2)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#94A3B8" stroke="#334155" stroke-width="1"/>
    <polygon points="0,6 12,12 12,25 0,19" fill="#475569" stroke="#334155" stroke-width="1"/>
    <polygon points="12,12 24,6 24,19 12,25" fill="#334155" stroke="#1E293B" stroke-width="1"/>
    <rect x="3" y="9" width="3" height="3" fill="#64748B"/>
    <rect x="15" y="14" width="3" height="3" fill="#1E293B"/>
    <rect x="18" y="9" width="2" height="2" fill="#64748B"/>
  </g>

  <!-- HEAD -->
  <rect x="52" y="42" width="108" height="88" rx="44" fill="url(#pebBody)" stroke="#94A3B8" stroke-width="2.5"/>
  <ellipse cx="50" cy="86" rx="6" ry="16" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="49" cy="86" rx="2" ry="8" fill="#38BDF8"/>
  <ellipse cx="162" cy="86" rx="6" ry="16" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="163" cy="86" rx="2" ry="8" fill="#38BDF8"/>
  <rect x="62" y="52" width="88" height="68" rx="30" fill="url(#pebScreen)" stroke="#1E293B" stroke-width="2"/>
  <path d="M72 60 C 84 56, 128 56, 140 60 C 130 66, 82 66, 72 60 Z" fill="white" opacity="0.12"/>
  
  <g filter="url(#pebGlow)">
    <ellipse cx="88" cy="86" rx="7" ry="9" fill="#38BDF8"/>
    <circle cx="90" cy="84" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="124" cy="86" rx="7" ry="9" fill="#38BDF8"/>
    <circle cx="126" cy="84" r="2.5" fill="#FFFFFF"/>
    <path d="M 100 99 C 103 103, 109 103, 112 99" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- TORSO -->
  <g transform="translate(0, 10)">
    <rect x="98" y="120" width="16" height="8" rx="3" fill="#64748B"/>
    <path d="M76 128 C 76 128, 80 176, 86 184 C 92 190, 120 190, 126 184 C 132 176, 136 128, 136 128 Z" fill="url(#pebBody)" stroke="#94A3B8" stroke-width="2.5"/>
    <circle cx="106" cy="152" r="5.5" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" filter="url(#pebGlow)"/>
  </g>

  <!-- ARMS -->
  <g transform="translate(0, 10)">
    <circle cx="68" cy="138" r="5" fill="#64748B"/>
    <rect x="42" y="140" width="26" height="12" rx="6" transform="rotate(32 42 140)" fill="url(#pebBody)" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="40" cy="164" r="4.5" fill="#475569"/>

    <circle cx="144" cy="138" r="5" fill="#64748B"/>
    <rect x="144" y="130" width="28" height="12" rx="6" transform="rotate(-38 144 130)" fill="url(#pebBody)" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="174" cy="108" r="4.5" fill="#475569"/>
  </g>

  <!-- LEGS -->
  <g transform="translate(0, 10)">
    <circle cx="90" cy="188" r="5" fill="#64748B"/>
    <rect x="78" y="192" width="14" height="26" rx="6" transform="rotate(10 78 192)" fill="url(#pebBody)" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="80" cy="224" rx="9" ry="5" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>

    <circle cx="122" cy="188" r="5" fill="#64748B"/>
    <rect x="118" y="192" width="14" height="26" rx="6" transform="rotate(-10 118 192)" fill="url(#pebBody)" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="132" cy="224" rx="9" ry="5" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
  </g>
</svg>
