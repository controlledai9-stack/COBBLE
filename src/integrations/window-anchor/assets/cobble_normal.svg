<svg width="200" height="230" viewBox="0 0 200 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pebGlassBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="16%" stop-color="#E0EEFF" stop-opacity="0.78"/>
      <stop offset="48%" stop-color="#C7DDFF" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#B4D0FE" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#93A5F8" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="pebIridescentRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="28%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="82%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="pebRingBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="pebRingFront" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EDE9FE" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#C4B5FD" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#A5F3FC" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#DDD6FE" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="pebRingGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(196, 181, 253, 0.7)"/>
      <stop offset="50%" stop-color="rgba(165, 243, 252, 0.85)"/>
      <stop offset="100%" stop-color="rgba(224, 231, 255, 0.6)"/>
    </linearGradient>
    <radialGradient id="pebNebulaCore" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#DDD6FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pebCrestHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pebGroundCaustic" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(147, 197, 253, 0.7)"/>
      <stop offset="45%" stop-color="rgba(196, 181, 253, 0.35)"/>
      <stop offset="75%" stop-color="rgba(165, 243, 252, 0.15)"/>
      <stop offset="100%" stop-color="rgba(224, 231, 255, 0)"/>
    </radialGradient>
    <filter id="pebCyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.0" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="pebSoftBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <!-- GROUND CAUSTIC GLOW -->
  <ellipse cx="100" cy="208" rx="46" ry="11" fill="url(#pebGroundCaustic)"/>
  <ellipse cx="100" cy="208" rx="26" ry="5.5" fill="#93C5FD" opacity="0.45" filter="url(#pebCyanGlow)"/>

  <!-- BACK HALF OF ORBITAL RING -->
  <g transform="rotate(-15 100 120)">
    <path d="M 24 120 A 76 18 0 0 1 176 120" stroke="url(#pebRingGlow)" stroke-width="9" opacity="0.5" stroke-linecap="round"/>
    <path d="M 24 120 A 76 18 0 0 1 176 120" stroke="url(#pebRingBack)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- GELATINOUS DROPLET BODY -->
  <path d="M 100 48 C 128 48, 160 70, 162 108 C 164 138, 154 166, 134 172 C 118 177, 108 168, 100 168 C 92 168, 82 177, 66 172 C 46 166, 36 138, 38 108 C 40 70, 72 48, 100 48 Z" fill="url(#pebGlassBody)" stroke="url(#pebIridescentRim)" stroke-width="2.4"/>

  <!-- INTERNAL COSMIC CORE & STAR PARTICLES -->
  <circle cx="100" cy="114" r="35" fill="url(#pebNebulaCore)"/>
  <circle cx="88" cy="108" r="1.3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="114" cy="118" r="1.4" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="102" cy="130" r="1.1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="94" cy="124" r="0.9" fill="#FFFFFF" opacity="0.9"/>

  <!-- CAUSTIC HIGHLIGHTS -->
  <path d="M 74 58 C 86 52, 114 52, 126 58 C 114 55, 86 55, 74 58 Z" fill="url(#pebCrestHighlight)"/>
  <path d="M 48 80 C 44 95, 48 116, 56 128 C 50 116, 48 95, 52 82 Z" fill="#FFFFFF" opacity="0.45"/>
  <path d="M 152 80 C 156 95, 152 116, 144 128 C 150 116, 152 95, 148 82 Z" fill="#FFFFFF" opacity="0.45"/>
  <path d="M 64 162 C 72 170, 92 170, 98 165" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 102 165 C 108 170, 128 170, 136 162" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- ROSY BLUSH CHEEKS -->
  <circle cx="68" cy="112" r="7" fill="#F472B6" opacity="0.25" filter="url(#pebSoftBlur)"/>
  <circle cx="132" cy="112" r="7" fill="#F472B6" opacity="0.25" filter="url(#pebSoftBlur)"/>

  <!-- EYES WITH VERTICAL GLOWING SLITS -->
  <rect x="78" y="86" width="12" height="22" rx="6" fill="#181B34"/>
  <rect x="82.5" y="89" width="3" height="12" rx="1.5" fill="#67E8F9" filter="url(#pebCyanGlow)"/>
  <rect x="83" y="90" width="2" height="10" rx="1" fill="#FFFFFF"/>
  <circle cx="84" cy="88" r="1.3" fill="#FFFFFF"/>

  <rect x="110" y="86" width="12" height="22" rx="6" fill="#181B34"/>
  <rect x="114.5" y="89" width="3" height="12" rx="1.5" fill="#67E8F9" filter="url(#pebCyanGlow)"/>
  <rect x="115" y="90" width="2" height="10" rx="1" fill="#FFFFFF"/>
  <circle cx="116" cy="88" r="1.3" fill="#FFFFFF"/>

  <!-- SMILE -->
  <path d="M 96 114 C 98 117, 102 117, 104 114" stroke="#312E81" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- FRONT HALF OF ORBITAL RING -->
  <g transform="rotate(-15 100 120)">
    <path d="M 176 120 A 76 18 0 0 1 24 120" stroke="url(#pebRingGlow)" stroke-width="10" opacity="0.5" stroke-linecap="round"/>
    <path d="M 176 120 A 76 18 0 0 1 24 120" stroke="url(#pebRingFront)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 168 122 A 68 15 0 0 1 32 122" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- STAR SPARKLE & DROPLETS -->
  <path d="M 170 56 Q 170 62 176 62 Q 170 62 170 68 Q 170 62 164 62 Q 170 62 170 56 Z" fill="#C4B5FD" opacity="0.85"/>
  <circle cx="32" cy="78" r="3" fill="#BAE6FD" opacity="0.75"/>
  <circle cx="166" cy="156" r="2.5" fill="#BAE6FD" opacity="0.75"/>
</svg>
