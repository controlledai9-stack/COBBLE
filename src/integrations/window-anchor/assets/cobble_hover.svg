<svg width="220" height="260" viewBox="0 0 220 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGradHang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screenGradHang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="eyeGlowHang" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ANTENNA & MINECRAFT COBBLESTONE CUBE -->
  <path d="M125 44 C 135 32, 142 22, 145 12" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(138, 2)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
    <polygon points="0,6 12,12 12,25 0,19" fill="#475569" stroke="#334155" stroke-width="1"/>
    <polygon points="12,12 24,6 24,19 12,25" fill="#334155" stroke="#1e293b" stroke-width="1"/>
    <rect x="3" y="9" width="3" height="3" fill="#64748b"/>
    <rect x="15" y="14" width="3" height="3" fill="#1e293b"/>
    <rect x="18" y="9" width="2" height="2" fill="#64748b"/>
  </g>

  <!-- HEAD -->
  <rect x="52" y="40" width="108" height="88" rx="44" fill="url(#bodyGradHang)" stroke="#94a3b8" stroke-width="2.5"/>
  <ellipse cx="50" cy="84" rx="6" ry="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="49" cy="84" rx="2" ry="8" fill="#38bdf8"/>
  <ellipse cx="162" cy="84" rx="6" ry="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="163" cy="84" rx="2" ry="8" fill="#38bdf8"/>
  <rect x="62" y="50" width="88" height="68" rx="30" fill="url(#screenGradHang)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- CUTE SURPRISED / DANGLING EYES (No flames) -->
  <g filter="url(#eyeGlowHang)">
    <circle cx="88" cy="84" r="9" fill="#38bdf8"/>
    <circle cx="89" cy="82" r="3" fill="#ffffff"/>
    <circle cx="124" cy="84" r="9" fill="#38bdf8"/>
    <circle cx="125" cy="82" r="3" fill="#ffffff"/>
    <!-- Small cute mouth -->
    <ellipse cx="106" cy="98" rx="5" ry="3" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- TORSO -->
  <g transform="translate(0, 8)">
    <rect x="98" y="122" width="16" height="8" rx="3" fill="#64748b"/>
    <path d="M76 130 C 76 130, 80 178, 86 186 C 92 192, 120 192, 126 186 C 132 178, 136 130, 136 130 Z" fill="url(#bodyGradHang)" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="106" cy="154" r="5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#eyeGlowHang)"/>
  </g>

  <!-- ARMS RAISED / FLAPPING GENTLY WHILE DRAGGED -->
  <g transform="translate(0, 8)">
    <!-- Left arm raised -->
    <circle cx="70" cy="138" r="5" fill="#64748b"/>
    <rect x="44" y="118" width="26" height="12" rx="6" transform="rotate(-30 44 118)" fill="url(#bodyGradHang)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="40" cy="116" r="4.5" fill="#475569"/>

    <!-- Right arm raised -->
    <circle cx="142" cy="138" r="5" fill="#64748b"/>
    <rect x="142" y="118" width="26" height="12" rx="6" transform="rotate(30 142 118)" fill="url(#bodyGradHang)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="172" cy="116" r="4.5" fill="#475569"/>
  </g>

  <!-- CUTE DANGLING LEGS & SHOES (NO THRUSTERS, NO FLAMES) -->
  <g transform="translate(0, 8)">
    <!-- Left dangling leg -->
    <circle cx="92" cy="188" r="4.5" fill="#64748b"/>
    <rect x="86" y="192" width="13" height="24" rx="6" transform="rotate(5 86 192)" fill="url(#bodyGradHang)" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="91" cy="222" rx="8" ry="4.5" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Right dangling leg -->
    <circle cx="120" cy="188" r="4.5" fill="#64748b"/>
    <rect x="114" y="192" width="13" height="24" rx="6" transform="rotate(-6 114 192)" fill="url(#bodyGradHang)" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="121" cy="222" rx="8" ry="4.5" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  </g>
</svg>
