<svg width="220" height="270" viewBox="0 0 220 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGradHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="screenGradHover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="eyeGlowHover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ANTENNA & MINECRAFT COBBLESTONE CUBE -->
  <path d="M125 42 C 135 30, 142 20, 145 10" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(138, 0)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
    <polygon points="0,6 12,12 12,25 0,19" fill="#475569" stroke="#334155" stroke-width="1"/>
    <polygon points="12,12 24,6 24,19 12,25" fill="#334155" stroke="#1e293b" stroke-width="1"/>
    <rect x="3" y="9" width="3" height="3" fill="#64748b"/>
    <rect x="15" y="14" width="3" height="3" fill="#1e293b"/>
  </g>

  <!-- HEAD WITH FOCUSED HOVER EYES -->
  <rect x="52" y="38" width="108" height="88" rx="44" fill="url(#bodyGradHover)" stroke="#94a3b8" stroke-width="2.5"/>
  <ellipse cx="50" cy="82" rx="6" ry="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="162" cy="82" rx="6" ry="16" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <rect x="62" y="48" width="88" height="68" rx="30" fill="url(#screenGradHover)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- FOCUSED ANGULAR EYES (From sketch) -->
  <g filter="url(#eyeGlowHover)">
    <polygon points="82,82 96,74 94,86" fill="#38bdf8"/>
    <polygon points="130,82 116,74 118,86" fill="#38bdf8"/>
  </g>

  <!-- TORSO -->
  <path d="M78 126 C 78 126, 82 170, 88 178 C 94 184, 118 184, 124 178 C 130 170, 134 126, 134 126 Z" fill="url(#bodyGradHover)" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- HAND THRUSTERS -->
  <g>
    <rect x="48" y="132" width="22" height="12" rx="6" transform="rotate(78 48 132)" fill="url(#bodyGradHover)" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="52" cy="166" rx="6" ry="3" fill="#334155"/>
    <polygon points="52,168 48,184 52,194 56,184" fill="#38bdf8" opacity="0.9"/>
    <polygon points="52,168 50,178 52,184 54,178" fill="#ffffff"/>
  </g>
  <g>
    <rect x="144" y="132" width="22" height="12" rx="6" transform="rotate(102 144 132)" fill="url(#bodyGradHover)" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="160" cy="166" rx="6" ry="3" fill="#334155"/>
    <polygon points="160,168 156,184 160,194 164,184" fill="#38bdf8" opacity="0.9"/>
    <polygon points="160,168 158,178 160,184 162,178" fill="#ffffff"/>
  </g>

  <!-- MAIN THRUSTER FLAME (Underneath Torso) -->
  <g transform="translate(106, 180)">
    <ellipse cx="0" cy="0" rx="14" ry="5" fill="#1e293b"/>
    <polygon points="0,0 -16,40 -6,64 0,78 6,64 16,40" fill="#0284c7" opacity="0.5" filter="url(#eyeGlowHover)"/>
    <polygon points="0,0 -10,32 0,56 10,32" fill="#38bdf8" opacity="0.9"/>
    <polygon points="0,0 -5,18 0,30 5,18" fill="#ffffff"/>
    <circle cx="-10" cy="48" r="1.5" fill="#38bdf8"/>
    <circle cx="8" cy="54" r="1.5" fill="#38bdf8"/>
    <circle cx="-4" cy="68" r="1" fill="#7dd3fc"/>
  </g>
</svg>
