<svg width="220" height="260" viewBox="0 0 220 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pebBodyHang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="pebScreenHang" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="pebGlowHang" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ANTENNA & MINECRAFT COBBLESTONE CUBE -->
  <path d="M125 46 C 135 34, 142 22, 145 12" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(138, 2)">
    <polygon points="12,0 24,6 12,12 0,6" fill="#94A3B8" stroke="#334155" stroke-width="1"/>
    <polygon points="0,6 12,12 12,25 0,19" fill="#475569" stroke="#334155" stroke-width="1"/>
    <polygon points="12,12 24,6 24,19 12,25" fill="#334155" stroke="#1E293B" stroke-width="1"/>
    <rect x="3" y="9" width="3" height="3" fill="#64748B"/>
    <rect x="15" y="14" width="3" height="3" fill="#1E293B"/>
    <rect x="18" y="9" width="2" height="2" fill="#64748B"/>
  </g>

  <!-- HEAD -->
  <rect x="52" y="42" width="108" height="88" rx="44" fill="url(#pebBodyHang)" stroke="#94A3B8" stroke-width="2.5"/>
  <ellipse cx="50" cy="86" rx="6" ry="16" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="49" cy="86" rx="2" ry="8" fill="#38BDF8"/>
  <ellipse cx="162" cy="86" rx="6" ry="16" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <ellipse cx="163" cy="86" rx="2" ry="8" fill="#38BDF8"/>
  <rect x="62" y="52" width="88" height="68" rx="30" fill="url(#pebScreenHang)" stroke="#1E293B" stroke-width="2"/>
  <path d="M72 60 C 84 56, 128 56, 140 60 C 130 66, 82 66, 72 60 Z" fill="white" opacity="0.12"/>
  
  <!-- SURPRISED DRAGGING EYES & MOUTH -->
  <g filter="url(#pebGlowHang)">
    <circle cx="87" cy="84" r="9.5" fill="#38BDF8"/>
    <circle cx="89" cy="82" r="3.5" fill="#FFFFFF"/>
    <circle cx="125" cy="84" r="9.5" fill="#38BDF8"/>
    <circle cx="127" cy="82" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="106" cy="99" rx="4.5" ry="5.5" fill="#38BDF8" opacity="0.9"/>
  </g>

  <!-- TORSO -->
  <g transform="translate(0, 10)">
    <rect x="98" y="120" width="16" height="8" rx="3" fill="#64748B"/>
    <path d="M76 128 C 76 128, 80 176, 86 184 C 92 190, 120 190, 126 184 C 132 176, 136 128, 136 128 Z" fill="url(#pebBodyHang)" stroke="#94A3B8" stroke-width="2.5"/>
    <circle cx="106" cy="152" r="5.5" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" filter="url(#pebGlowHang)"/>
  </g>

  <!-- ARMS RAISED -->
  <g transform="translate(0, 10)">
    <circle cx="68" cy="134" r="5" fill="#64748B"/>
    <rect x="36" y="126" width="28" height="11" rx="5.5" transform="rotate(-40 36 126)" fill="url(#pebBodyHang)" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="28" cy="104" r="4.5" fill="#475569"/>

    <circle cx="144" cy="134" r="5" fill="#64748B"/>
    <rect x="146" y="136" width="28" height="11" rx="5.5" transform="rotate(40 146 136)" fill="url(#pebBodyHang)" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="184" cy="104" r="4.5" fill="#475569"/>
  </g>

  <!-- DANGLING LEGS (No thruster flames) -->
  <g transform="translate(0, 10)">
    <circle cx="90" cy="188" r="5" fill="#64748B"/>
    <rect x="82" y="192" width="13" height="28" rx="6" transform="rotate(8 82 192)" fill="url(#pebBodyHang)" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="86" cy="226" rx="9" ry="5" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>

    <circle cx="122" cy="188" r="5" fill="#64748B"/>
    <rect x="117" y="192" width="13" height="28" rx="6" transform="rotate(-8 117 192)" fill="url(#pebBodyHang)" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="125" cy="226" rx="9" ry="5" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
  </g>
</svg>
